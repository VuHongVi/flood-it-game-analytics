[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flood-it"
version = "0.1.0"
description = "Firebase/GA4 mobile-game analytics pipeline for the public Flood-It dataset"
requires-python = ">=3.10"

[project.scripts]
flood-it = "flood_it.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
